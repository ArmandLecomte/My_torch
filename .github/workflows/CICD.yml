name: CICD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  EPITECH_REPO: "git@github.com:EpitechPGE3-2026/G-CNA-501-PAR-5-1-mytorch-1.git"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-to-mirror:
    if: github.repository == 'ArmandLecomte/My_torch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: Push to Epitech Repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.EPITECH_REPO }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
