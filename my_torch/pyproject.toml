[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my_torch"
version = "0.1.0"
description = "A simple PyTorch-like library"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
benchmark = [
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
